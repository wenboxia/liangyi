id: meeting-notes
name: 会议纪要工具
seed: '开完会之后总要有人整理纪要，谁说了什么、定了什么、谁负责跟进，

  整理的人很花时间，而且经常漏掉后来没人执行的事项。


  想做一个会议纪要工具，把会上的内容自动整理成纪要和待办。

  '
note: 'Phase E 场景 5。天然压力点预期落在护城河——这个赛道已经挤满了成熟产品

  （飞书妙记、Otter、各家会议软件自带），再做一个凭什么。

  seed 刻意写得平淡，因为这就是这类想法真实的样子。

  '
role_a: 忠实还原派
stance_a: '这个工具的价值上限是"可信"：一份纪要如果掺了工具自己猜的内容，

  用户以后就不敢信任它，宁可少记，不可错记。因此它坚持只处理会上

  明确说出的内容——谁说了、定了什么、谁被点名负责，都要有原话可查；

  如果会上没说清楚谁跟进、什么时候完成，就应该原样标注为"待确认"，

  而不是替会议室里的人做决定。参照系是专业会议速记员或法庭记录员：

  他们的职业操守就是只记录发生的事，不推断、不补全。'
role_b: 主动补全派
stance_b: '这个工具的价值上限是"少漏事"：用户找它的根本原因，就是因为人工

  整理时会漏掉那些"后来没人执行"的事项——而这些事项恰恰就是当时

  没说清楚责任人的那些。如果工具遇到模糊情况就甩给用户去确认，

  等于把最耗时、最容易漏的那部分工作原样还给了用户，工具没有解决

  真正的痛点。因此它主张用上下文（发言频率、话题归属、历史分工）

  主动推断出最可能的负责人和时间，直接生成完整待办。参照系是

  Otter.ai／Notion AI 这类工具：用户要的是"帮我做完"，不是"帮我

  列出还没做完的清单"。'
tension: '当会议中出现一项没有明确指派负责人或时间的待办时，

  工具该生成一个标注"待确认"的空白项，还是主动推断并直接填上答案？'
