id: dev-diagnose
name: 独立开发者的线上报错诊断助手

# seed 刻意写短（3 句话），只说清楚：用户是谁、痛点是什么、产品大概什么形态。
# 不写商业模式（让链条去挖）、不写技术方案（超出方法论作用域）、不列功能清单
# （让链条去展开）。seed 越短，v0 到 v5 的增量越明显。
seed: |
  独立开发者和小团队没有专职运维，线上服务出错时往往是用户先发现、他们后知道，
  然后要在一堆日志里翻半天才能定位原因。

  想做一个工具：接上他们的服务之后，报错发生时自动分析原因并给出修复方向，
  让没有运维的人也能及时处理线上问题。

# P1 的两个专家角色必须有结构性张力——不是程度差异，是立场分歧。
# 判据：两个都合理，但结论不同。
role_a: 自动化优先派
stance_a: |
  立场：这类工具的价值上限取决于它能替开发者完成多少工作。开发者要的不是
  「更好的日志阅读器」，是「问题被解决」。产品应该尽可能往自动化推进——
  自动监控、主动推送、自动定位、自动生成修复方案，让人只需要做最后的确认。
  能自动化而不自动化，就是把本该产品承担的成本推回给用户。
  参照系：Sentry 的自动告警、Dependabot 的自动 PR、各类 AIOps 平台。

role_b: 可控性优先派
stance_b: |
  立场：线上系统的核心约束是「出事谁负责」。工具越自动，开发者对系统的理解
  越浅，真出问题时越无法判断。产品的价值应该在于让开发者**更快地理解发生了
  什么**，而不是替他做决定。自动改代码、自动接入生产环境这类设计，在小团队
  没有 code review 兜底的情况下是在放大风险而不是降低风险。
  参照系：可观测性工具（Grafana / Honeycomb）强调的是「让人看懂」不是「替人做」。

tension: 自动化程度 vs 开发者对系统的掌控与理解

note: |
  Phase B 的流程验证场景。选它是因为在设计讨论阶段已经用它测过三个模型的
  批判质量，对「合格的批判长什么样」有基线认知，便于判断链条产出是否正常。
