id: what-to-wear
name: 每天早上告诉你今天穿什么
seed: '很多人早上站在衣柜前发呆，不知道穿什么，随便抓一件出门，

  到了公司又觉得穿得不合适——要么冷了热了，要么跟当天的场合不搭。


  想做一个东西，每天早上直接告诉你今天穿哪几件，不用自己想。

  '
note: 'Phase E 场景 4。天然压力点预期落在前提假设——"人希望别人替自己决定穿什么"

  这个前提本身可能就不成立。这个场景是五个里面最可能被 P2D 整个掀翻的，

  正好用来观察拆台这一步在前提有问题时的表现。

  '
role_a: 唯一答案派
stance_a: '认为这个产品的价值上限在于彻底消灭"选择"这个动作本身——用户早上真正要的不是"更好的建议"，

  而是"不用做决定"。如果每次还要在两三个选项里挑一个，本质上仍然是在做决定，只是选项变少了，

  认知负担并没有真正消失。会为了守住这个目标而牺牲"万一算错"的风险，宁可偶尔穿得不理想，

  也要保证"完全不用想"这件事不被打破。参照系：像自动挡汽车——你不需要决定换几档，

  系统直接决定，你只管开。'
role_b: 有限选择派
stance_b: '认为这个产品的价值上限在于"被用户长期信任"，而信任建立在用户始终觉得自己握有最终决定权。

  如果系统给错一次答案又没有退路，用户会立刻失去信任，弹回"自己想"的旧习惯，产品就废了。

  会为了保留这条退路，牺牲一部分"零思考"的纯粹性，愿意让用户在两三件里选一件，

  即便这仍然是一种选择。参照系：像Netflix的推荐——它不会直接帮你播放一部电影，

  而是给你几个选项，选择空间已经被极大收窄，但决定权还在你手上。'
tension: 当算法给出的推荐用户不完全满意时，系统该不该提供备选项，还是坚持只给一个答案。
