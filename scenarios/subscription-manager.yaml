id: subscription-manager
name: 订阅管理助手
seed: '现在人身上挂着一堆订阅——视频会员、音乐、云存储、各种 App 的会员，

  很多是当初图便宜开了年费，后来根本不用，扣钱的时候才想起来还有这个。


  想做一个工具，帮人把这些订阅理清楚：还有哪些在扣钱、哪些其实早就不用了、

  哪个该退。

  '
note: 'Phase E 场景 1。天然压力点预期落在商业逻辑——一个帮人省钱的工具自己怎么赚钱，

  是这类产品的经典难题。但这是预期不是设计目标，seed 里没有刻意埋这个雷。

  '
role_a: 数据打通自动扫描派
stance_a: 认为产品的价值上限取决于能不能精准且不遗漏地识别出用户名下所有正在扣款的订阅——如果只靠用户手动记录，那和用户自己拿个笔记本记账没有本质区别，根本解决不了"忘记自己还在订阅"这个核心问题。为了达到这个上限，应该主动申请读取银行扣款短信、邮箱账单、支付宝/微信支付记录的权限，把扣款源头直接打通、自动扫描出所有订阅记录，哪怕这意味着要用户对一个第三方工具让出较高的隐私权限。参照系是
  Rocket Money（原 Truebill）这类应用——它们能做起来正是因为打通了账单源头，而不是让用户手动输入。
role_b: 最小权限手动清单派
stance_b: 认为产品的价值上限不在于识别有多全，而在于用户敢不敢把敏感数据交出来——一旦在引导流程里要求授权读取银行短信、邮箱或支付记录，大部分用户会在授权这一步直接流失，工具压根没有机会证明自己的价值。为了先拿到用户信任、把产品立住，应该放弃自动扫描，只做用户主动输入+定期提醒确认的轻量清单，哪怕这意味着覆盖不全、漏掉的订阅还得靠用户自己想起来登记。参照系是国内一批要求金融权限的记账
  App 因授权门槛和信任问题做不起来，而 Notion 模板一类"不越界"的轻量清单工具反而活得更久。
tension: 为了让订阅识别更完整，产品要不要在获取用户信任之前，就要求用户开放银行短信/邮箱/支付记录等敏感权限。
