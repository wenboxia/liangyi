<script>
const D = window.__DATA__, J = D.judging || {};
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PLAIN = t => String(t==null?'':t)
  .replace(/收窄变形/g,'被改小').replace(/收窄/g,'被改小')
  .replace(/未守住/g,'被推翻').replace(/守住/g,'原样保留')
  .replace(/判不动/g,'无法判断');
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+?)`/g,'<code>$1</code>');
const tbl = (node, head, rows) => {
  node.innerHTML='';
  if(head){const tr=el('tr'); head.forEach(h=>tr.appendChild(el('th',h.cls||'',h.t!==undefined?h.t:h))); node.appendChild(el('thead')).appendChild(tr);}
  const tb=el('tbody');
  rows.forEach(r=>{const tr=el('tr',r.cls||''); (r.cells||r).forEach(c=>{const td=el('td',(c&&c.cls)||'',c&&c.h!==undefined?c.h:esc(c)); tr.appendChild(td);}); tb.appendChild(tr);});
  node.appendChild(tb);
};

const VERS=['v0','v1','v2','v3','v4','v5'], CHAIN=['v1','v2','v3','v4','v5'];
const M = J.matrix||{}, IDS = D.points.map(p=>p.id);
const judged = VERS.every(v=>M[v]);
const LABEL = {'守住':'原样保留','收窄变形':'被改小','未守住':'被推翻','判不动':'无法判断'};
const CLR = {'守住':'var(--keep)','收窄变形':'var(--shrunk)','未守住':'var(--broke)','判不动':'var(--ink-faint)'};
const cnt = (v,st) => IDS.filter(p=>M[v]&&M[v][p]&&M[v][p].state===st).length;

/* ---------- 顶部 ---------- */
const slots={}; D.steps.forEach(s=>{ slots[s.model]=(slots[s.model]||new Set()).add(s.window); });
const NICE={'claude-sonnet-5':'Claude','deepseek-v4-pro':'DeepSeek','glm-5.3':'GLM'};
$('#model-line').textContent = '默认：' +
  Object.entries(slots).sort((a,b)=>b[1].size-a[1].size)
    .map(([m,w])=>`${NICE[m]||m} × ${w.size}`).join(' + ') +
  ' · 跨维度是硬规则，具体模型可替换';

/* ---------- 一 · 入口 ---------- */
$('#portal-note').textContent = '完整十三步 · 演示配置跑一次约 5–10 分钟';

/* ---------- 二 · 状态机 ---------- */
const WHAT = {
 'P0':'把原始想法忠实精炼一遍。不改逻辑、不扩展、不质疑——让想法可以被对抗，而不是先对抗它。',
 'P1.0':'生成两个结构性对立的专家角色，并当场检测是不是假对立。两个角色如果只是措辞不同，后面整条对抗链就是空转。场景已写死角色时跳过。',
 'P1A':'专家 A 视角独立产出一份方案。',
 'P1B':'专家 B 视角独立产出一份方案。这个窗口看不到 A 的方案——独立是对抗成立的前提条件。',
 'P1.4':'执笔窗口把两份方案融合成单一立场的 v1，不保留双声音的痕迹。',
 'P2A':'怀疑论投资人视角批判：市场与商业逻辑上哪里站不住。',
 '2A-fix':'按批判改出 v2，逐条记下采纳、部分采纳还是驳回。',
 'P2B':'零上下文单盲复审。这个窗口永远收不到任何历史，只拿到方案正文——它模拟一个陌生读者，用来暴露知情者看不见的盲区。',
 '2B-fix':'按单盲意见改出 v3。',
 'P2C':'知情复审：同时拿到 v1 和 v3，检测方向漂移。它问的不是「哪版更好」，是「产品的身份、承诺、目标用户有没有在不知不觉里被换掉」。',
 '2C-rollback':'把漂移的部分回退，改出 v4。全链唯一一步删多于加。',
 'P2D':'拆台专家质疑方案的前提。必须由「任务优先」坐标承担——「规范优先」坐标的模型扮演拆台角色时，会在最关键处软化攻击。',
 '2D-fix':'给每条拆台论据分级，判「框架内改出 v5」还是「回 P1 重做」。这是唯一能让全自动流程卡住的位置。',
};
const FIX = new Set(['P1.4','2A-fix','2B-fix','2C-rollback','2D-fix']);
const STOP = new Set(['2C-rollback','2D-fix']);
function drawFSM(){
  const n=D.steps.length, W=940, H=132, PL=18, PR=18;
  const x=i=>PL+i*(W-PL-PR)/(n-1);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  s+=`<line x1="${x(0)}" y1="46" x2="${x(n-1)}" y2="46" stroke="#C8BFB0" stroke-width="1"/>`;
  D.steps.forEach((st,i)=>{
    const stop=STOP.has(st.id), fix=FIX.has(st.id);
    const fill = stop?'#A02C2C':(fix?'#3D3530':'#F5F1E8');
    const r = stop?7:5.5;
    s+=`<g class="fsm-dot" data-i="${i}" style="cursor:pointer">`;
    s+=`<circle cx="${x(i)}" cy="46" r="14" fill="transparent"/>`;
    s+=`<circle cx="${x(i)}" cy="46" r="${r}" fill="${fill}" stroke="${stop?'#A02C2C':'#6B5D4F'}" stroke-width="1.4"/>`;
    s+=`<text x="${x(i)}" y="${i%2?76:26}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="#6B5D4F">${esc(st.id)}</text>`;
    s+=`</g>`;
  });
  // 回边
  s+=`<path d="M ${x(n-1)} 60 Q ${(x(0)+x(n-1))/2} 118 ${x(0)} 60" fill="none" stroke="#A02C2C" stroke-width="1" stroke-dasharray="5 4" opacity=".65"/>`;
  s+=`<text x="${(x(0)+x(n-1))/2}" y="112" text-anchor="middle" font-size="10" fill="#A02C2C">回 P1 重做 · 整链重跑</text>`;
  s+=`<path d="M ${x(n-1)} 34 Q ${(x(5)+x(n-1))/2} 4 ${x(5)} 34" fill="none" stroke="#3E5D6C" stroke-width="1" stroke-dasharray="5 4" opacity=".65"/>`;
  s+=`<text x="${(x(5)+x(n-1))/2}" y="12" text-anchor="middle" font-size="10" fill="#3E5D6C">回 P2 重压 · v5 当新 v1</text>`;
  s+='</svg>';
  $('#fsm').innerHTML=s;
  document.querySelectorAll('.fsm-dot').forEach(g=>g.onclick=()=>showStep(+g.dataset.i));
}
function showStep(i){
  const s=D.steps[i];
  $('#step-detail').innerHTML=`<div class="act-top"><span class="act-id">${esc(s.id)}</span>
    <span class="act-title">${esc((s.role||'').split('——')[0].split('—')[0].trim()||s.id)}</span>
    <span class="act-ver">${esc(s.model)} · ${esc(s.coordinate)} · ${s.window}</span></div>
    <div class="act-who">${esc(WHAT[s.id]||'')}</div>
    <div class="act-row"><span>产出 <b>${s.chars}</b> 字</span><span>耗时 <b>${s.sec}</b> 秒</span>
      <span>花费 <b>$${s.cost.toFixed(4)}</b></span>${s.think?`<span>思考 <b>${s.think}</b> token</span>`:''}</div>`;
}
drawFSM(); showStep(0);

// 最后一步会给每条拆台论据打两个标：打中的是前提还是实施细节、有没有给出具体反例。
// 「既打中前提、又给了具体反例」的那种是致命的，两条以上就说明方向站不住。
const EXITS=[
 ['产出 v5','done','没有致命论据，且大部分批判打的是实施细节',
  '方向站得住，问题在框架内消化掉，正常结束。VoyageGuard 那次走的就是这条。',''],
 ['回 P1 重做','back-to-p1','出现两条以上致命论据，且还是第一轮',
  '方向被推翻，整链重跑，只带原始想法回到起点。','a'],
 ['回 P2 重压','back-to-p2','致命论据不足两条，但大部分批判都在打前提',
  '方向可能错了，但没被证死。上一轮的成品逐字当作新一轮的初稿，只重跑那四轮批判。','b'],
 ['结构性死锁','deadlock','第二轮仍有两条以上致命论据，且议题和第一轮大量重叠',
  '重跑也会撞同一堵墙，停下来出报告而不是空转。',''],
];
// 每条出口的真实状态。分三级，别把它们混成一句「验过了」：
//   走过    —— 真实运行走到过这个收场
//   判出过  —— 模型判出过，但那次运行没能真的开出第二轮
//   装置验过 —— 用真实判定书离线驱动过编排器，第二轮目录真的建出来了
const WALKED = {};
D.runs.forEach(r => { const k = r.verdict || r.status; WALKED[k] = (WALKED[k]||0)+1; });
const VERDICT_OF = {'done':'produced-v5','back-to-p1':'back-to-p1','back-to-p2':'back-to-p2','deadlock':'structural-deadlock'};
const RIG_VERIFIED = new Set(['back-to-p1','back-to-p2']);
$('#exits').innerHTML = EXITS.map(e=>{
  const n = WALKED[VERDICT_OF[e[1]]] || 0;
  const looped = D.runs.some(r => (r.rounds||1) > 1 && r.verdict === VERDICT_OF[e[1]]);
  let badge;
  if (e[1] === 'done') badge = `<span style="color:var(--indigo)">走过 ${n} 次</span>`;
  else if (looped)     badge = `<span style="color:var(--indigo)">真的循环过 ${n} 次</span>`;
  else if (RIG_VERIFIED.has(e[1]))
    badge = `<span style="color:var(--shrunk)">装置验过${n?`，判出过 ${n} 次`:''}，但还没有一次真实运行走完第二轮</span>`;
  else badge = `<span style="color:var(--cinnabar)">至今没有判出过</span>`;
  return `<div class="exit-card ${e[4]}"><b>${e[0]}</b> <code>${e[1]}</code>
    <span style="float:right;font-size:.76rem">${badge}</span>
    <div>${esc(e[2])} —— ${esc(e[3])}</div></div>`;}).join('')
  + `<div class="exit-card"><b>两道闸</b><div>最多 2 轮、单链 $3 封顶。触顶时写明是哪道闸拦下的，不静默继续。</div></div>`;

$('#loop-status').innerHTML = `
 <div class="note"><b>循环装置本身验过了，但没有一次真实运行走完第二轮。</b>
   验的方式是拿<em class="k">真实跑出来的判定书</em>离线驱动编排器：第二轮目录真的建出来、
   回 P1 时整链重跑、回 P2 时只从批判那一步开始、第一轮产物没被覆盖、第三轮被终止条件拦下。
   这些是<b>装置对不对</b>的证据，不是<b>模型判得准不准</b>的证据。</div>
 <div class="note"><b>而模型判得很不稳。</b>同一个场景、同一份待判文档，三次运行给出三种分级：
   <br><br>
   <code>2026-09-02</code> 5 条打中前提、0 条致命 → 产出 v5<br>
   <code>2026-09-10</code> 5 条打中前提、<b>2 条致命</b> → <b>判回 P1</b><br>
   <code>同日重跑</code> <b>0 条</b>打中前提 → 产出 v5
   <br><br>
   打中前提的条数从 5 跳到 0。<em class="k">整条链上唯一能推翻方向的判断点，
   自己就在骰子上。</em>四条出口全部建立在这个信号之上。
   <br><br>
   这也是为什么不靠「多跑几次撞上某个出口」来验循环——
   撞上了也只说明这次骰子这么掷。</div>`;

/* ---------- 三 · 组合与机制 ---------- */
tbl($('#coord-table'), ['维度','档位','含义'], [
 [{h:'<b>A · 冲突偏向</b>'},{h:'<code>A1</code> 规范优先'},'训练目标里有一份独立于任务的成文规范，冲突时规范压过任务'],
 ['',{h:'<code>A2</code> 权限优先'},'规范存在，但形态是「谁说了算」的排序，按权限链裁决，不自己做价值判断'],
 ['',{h:'<code>A3</code> 任务优先'},'公开材料里找不到独立于任务的规范层，奖励信号全部来自任务完成度'],
 ['',{h:'<span style="color:var(--cinnabar)">未公开</span>'},{h:'厂商未公开后训练目标 —— <b>不进入任何组合</b>'}],
 [{h:'<b>B · 语料文化</b>'},{h:'<code>B1</code> 英文母语'},''],
 ['',{h:'<code>B2</code> 中文母语'},''],
 ['',{h:'<code>B3</code> 跨文化双核'},''],
]);

const WINROLE={};
D.steps.forEach(s=>{ if(!WINROLE[s.window]) WINROLE[s.window]={model:s.model,coord:s.coordinate,role:s.role,steps:[]}; WINROLE[s.window].steps.push(s.id); });
tbl($('#window-table'), ['窗口','模型','坐标','承担'],
  Object.entries(WINROLE).map(([w,v])=>[
    {h:`<code>${w}</code>`},{h:esc(v.model)},
    {h:`<span style="color:var(--indigo)">${esc(v.coord)}</span>`},
    {h:esc((v.role||'').split('——')[0].trim())+`<br><span style="color:var(--ink-light);font-size:.8rem">${v.steps.join(' · ')}</span>`}]));

tbl($('#combo-table'), ['','组合','坐标分布','说明'], [
 [{h:'<b style="color:var(--indigo)">默认</b>'},'Claude × 4 + DeepSeek × 2 + GLM × 1','A1·B1 + A3·B3 + A3·B2',{h:'两维都跨，divergence 最强。本站所有实测跑的都是它。'}],
 [{h:'替代 A'},'Claude 整体换 GPT','A2·B1 + A3·B3 + A3·B2',{h:'区域或账号限制时用。A2 走权限链裁决而不是价值命题，暴露的盲区方向不同。'}],
 [{h:'替代 B'},'中文侧只有一个模型','A1·B1 + A3·B3 × 2',{h:'资源受限时的宽松版。单盲和拆台共用同一坐标（不同窗口），divergence 弱于默认组合，建议单盲的提示词纪律更严作为补偿。'}],
 [{h:'<b style="color:var(--cinnabar)">违规</b>'},'同坐标全覆盖（比如全 Claude 七个窗口）','全 A1·B1',{h:'<b>假 divergence。</b>同坐标模型共享对齐栈和语料文化，因此共享价值观盲区——四条看似独立的批判可能一起漏掉同一块维度。'}],
]);
$('#excluded-note').innerHTML = `<b>维度 A 未公开的模型，不进入任何组合。</b>
  判不了坐标就判不了 divergence，判不了 divergence 就不知道这条批判到底覆盖了什么。
  这一条是<em class="k">硬规则，不是资源限制</em>——项目手上有这类模型的可用 key，仍然按规则排除。`;

const MECHS=[
 ['规则 · 1','四轴 divergence','任何一对窗口都应该在四个维度上不同：AI 身份（哪个模型）· 角色（扮演谁）· 上下文（新开还是续）· 范围（完整方案还是某个切片）。如果两个窗口四轴完全一致，那只是一个批判者，不是两个。'],
 ['硬规则 · 2','P2 链必须跨底模坐标','四轮批判至少跨一个维度。同坐标模型共享对齐栈和语料文化，因此共享价值观盲区，全用同一家覆盖等于假覆盖。'],
 ['硬规则 · 3','单盲 = 零上下文','单盲窗口只能收到方案正文。不给背景、不给目标、不说「这是给谁用的」——你一旦给它背景，它就开始猜意图，这个机制当场失效。提示词里明文禁止脑补与优化建议。'],
 ['规则 · 4','作者 ≠ 批判者','执笔窗口负责写和全部修改（保一致性）。批判窗口新开——没有作者包袱。复审窗口也新开——不被批判者的立场锚定。一个窗口复用多个角色会让机制整体坍塌。'],
 ['规则 · 5','Linear 链路防认知过载','批判 → 修改 → 批判 → 修改，一次处理一条。四条批判一起上，会逼人同时持有四个框架，必然选择性忽略。Linear 让每条批判有独立的判断窗口。'],
 ['规则 · 6','方向漂移不是错漏列表','知情复审问的不是「还有什么错」——细节错漏属于投资人批判那一轮。它问的是：响应完前两轮之后，方案是否已经从最初的核心定位偏移了。'],
];
$('#mechs').innerHTML = MECHS.map(m=>`<div class="mech"><div class="mtag">${m[0]}</div>
  <h4>${esc(m[1])}</h4><p>${esc(m[2])}</p></div>`).join('');

/* ---------- 四 · 实测 ---------- */
const RH = (D.result&&D.result.rework_hits)||[];
const hit = RH.filter(x=>x.hit).length;
const v0hit = (J.v0_rework||[]).filter(x=>x.hit).length;
const totalCost = D.steps.reduce((a,s)=>a+s.cost,0);
const totalMin = Math.round(D.steps.reduce((a,s)=>a+s.sec,0)/60);

$('#seed-chars').textContent = D.seed.chars;
$('#seed-text').innerHTML = '<p>'+esc(D.seed.text).replace(/\n\n+/g,'</p><p>')+'</p>';

$('#verdict-line').innerHTML = judged ? `一段 <em class="k">${D.seed.chars} 字</em>的想法，经过十三步、
  $${totalCost.toFixed(2)}、${totalMin} 分钟，长成一份 <em class="k">${D.versions.v5.chars} 字</em>的方案。
  14 条原子主张里 ${cnt('v5','守住')} 条原样保留，${cnt('v5','收窄变形')} 条被改小，${cnt('v5','未守住')} 条被推翻。
  <br><br>项目初期真做这件事时踩过、后来返工修掉的 7 个坑，这条链
  <span class="wavy">避开了 ${hit} 个</span>；同一个想法只调用一次模型、不走流程，
  只避开 <em class="k">${v0hit} 个</em>。` : '<span class="pending">判定数据尚未生成。</span>';

$('#stats').innerHTML = [
 [D.points.length,'条原子点',''],
 [judged?cnt('v5','守住'):'—','条原样保留到最后',''],
 [hit+'<small>/7</small>','走完流程 · 避开的坑',''],
 [v0hit+'<small>/7</small>','只调用一次 · 避开的坑','cin'],
].map(s=>`<div class="stat"><div class="n"${s[2]==='cin'?' style="color:var(--cinnabar)"':''}>${s[0]}</div><div class="l">${s[1]}</div></div>`).join('');

tbl($('#points-table'), ['#','这条主张说的是什么'],
  D.points.map(p=>[{h:`<code>${p.id}</code>`,cls:'num'},{h:md(p.text)}]));
tbl($('#points-src'), ['#','主张','原文依据'],
  D.points.map(p=>[{h:`<code>${p.id}</code>`,cls:'num'},{h:md(p.text)},
   {h:`<span style="color:var(--ink-light)">${md(p.source)}</span>`}]));

/* ---------- 带状流图 ---------- */
function river(){
  if(!judged){ $('#river').innerHTML='<p class="pending">判定数据尚未生成。</p>'; return; }
  const STS=['守住','收窄变形','未守住'];
  const W=840,H=260,PL=54,PR=120,PT=26,PB=44;
  const x=i=>PL+i*(W-PL-PR)/(CHAIN.length-1);
  const unit=(H-PT-PB)/14;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  let base=CHAIN.map(()=>PT);
  STS.forEach(st=>{
    const pts=[],bot=[];
    CHAIN.forEach((v,i)=>{ const h=cnt(v,st)*unit; pts.push([x(i),base[i]]); bot.push([x(i),base[i]+h]); base[i]+=h; });
    const d='M '+pts.map(p=>p.join(' ')).join(' L ')+' L '+bot.slice().reverse().map(p=>p.join(' ')).join(' L ')+' Z';
    s+=`<path class="strand" data-state="${st}" d="${d}" fill="${CLR[st]}" opacity=".88"/>`;
  });
  CHAIN.forEach((v,i)=>{
    s+=`<line x1="${x(i)}" y1="${PT-6}" x2="${x(i)}" y2="${H-PB+4}" stroke="#F5F1E8" stroke-width="1" opacity=".55"/>`;

$('#annot-export').onclick=()=>{
  const ks=Object.keys(notes);
  if(!ks.length){ alert('还没有批注'); return; }
  const txt=ks.map(k=>`【${k}】\n${notes[k]}`).join('\n\n');
  navigator.clipboard.writeText(txt).then(()=>alert(`已复制 ${ks.length} 条批注，直接粘给我`),
    ()=>{ const w=window.open(''); w.document.write('<pre>'+esc(txt)+'</pre>'); });
};
</script>
</body>
</html>
